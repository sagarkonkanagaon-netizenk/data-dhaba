name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each PR gets its own lane: a new push cancels only that PR's older build.
# Deploys from main queue one after another and are never cancelled, so merging
# two PRs back to back cannot cancel a PR check or a live deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  content-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # same Python as Pyodide in the browser
      - run: pip install duckdb==1.4.1 pandas==2.3.3
      - name: Run every SQL handbook example against the Playground tables
        run: |
          node scripts/dump_big_setup.mjs > /tmp/big.json
          python scripts/check_sql_blocks.py /tmp/big.json
      - name: Run every Python handbook example, chapter by chapter
        run: |
          python scripts/check_py_blocks.py content-src/python
          python scripts/check_py_blocks.py content-src/python/pro

  build:
    needs: content-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
