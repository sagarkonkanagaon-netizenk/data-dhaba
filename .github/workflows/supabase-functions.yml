# Deploys the Pro payment functions to Supabase and copies their secrets there, so nothing has to be
# pasted into the Supabase code editor. Runs when a function changes on main, or by hand:
# Actions > "Deploy payment functions" > Run workflow (do this after changing any secret below).
#
# GitHub > Settings > Secrets and variables > Actions > Secrets:
#   SUPABASE_ACCESS_TOKEN    Supabase > Account > Access Tokens > Generate new token (required)
#   RAZORPAY_KEY_ID          rzp_test_… or rzp_live_…
#   RAZORPAY_KEY_SECRET      the key secret from Razorpay
#   RAZORPAY_WEBHOOK_SECRET  the secret typed into the Razorpay webhook
#   PRO_TEST_EMAILS          optional: emails allowed to check out while the keys are test keys
#   PRO_USD_6M, PRO_USD_1Y   optional: US-dollar prices in cents (both needed before USD shows)
# Secrets left empty are not touched in Supabase.
name: Deploy payment functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/supabase-functions.yml']

concurrency:
  group: supabase-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pxcsthofjqozphwnzaql
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (see the top of this file)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Copy secrets to Supabase
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          PRO_TEST_EMAILS: ${{ secrets.PRO_TEST_EMAILS }}
          PRO_USD_6M: ${{ secrets.PRO_USD_6M }}
          PRO_USD_1Y: ${{ secrets.PRO_USD_1Y }}
        run: |
          set -euo pipefail
          envfile=$(mktemp)
          trap 'rm -f "$envfile"' EXIT
          for name in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET PRO_TEST_EMAILS PRO_USD_6M PRO_USD_1Y; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> "$envfile"; echo "will set $name"; fi
          done
          if [ -s "$envfile" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "$envfile"
          else
            echo "No payment secrets in GitHub yet; skipping."
          fi
      - name: Deploy pro-pay and razorpay-webhook
        run: |
          set -euo pipefail
          # Both functions check requests themselves (sign-in for pro-pay, Razorpay's signature for the webhook).
          for fn in pro-pay razorpay-webhook; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
